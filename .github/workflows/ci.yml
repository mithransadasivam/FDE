name: CI

# Nothing is merged unless the tests pass. Every test uses the fake models and a temporary database: no test calls a real model.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_MODELS: "1"
      SECRET_KEY: "ci-secret-key-not-used-anywhere-else"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -m playwright install --with-deps chromium
      - name: Tests (fake models, recorded audio, Playwright)
        run: pytest -q
      - name: Quality gate (extraction, ranking, interview scoring, copilot, red team, bias, governance)
        run: python -m scripts.quality_gate
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            evidence/
            EVAL_REPORT.md
            SECURITY_FINDINGS.md
            BIAS_REPORT.md
            PERF_REPORT.md
