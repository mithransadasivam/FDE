<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the IT policies</title>
<style>
  :root { --bg: #f6f7fb; --card: #ffffff; --ink: #1f2440; --muted: #5d6385; --accent: #3b4cc0; --line: #dfe2ef; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; white-space: pre-wrap; }
  .msg.user { background: #e9ecfb; border-color: #cfd5f5; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ask the IT policies</h1>
  <p class="lead">Answers come only from the IT policy documents, with the source of each fact. <a href="/dashboard">Dashboard</a> · <a href="/docs">API</a></p>
  <div id="chat" aria-live="polite"></div>
</main>
<form id="ask">
  <div class="row">
    <input id="question" name="question" placeholder="Ask a question about the IT policies" maxlength="4000" autocomplete="off" aria-label="Question">
    <button id="send" type="submit">Ask</button>
  </div>
</form>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("ask");
const input = document.getElementById("question");
const send = document.getElementById("send");

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  send.disabled = true;
  bubble("user", question);
  const reply = bubble("assistant", "");
  reply.setAttribute("data-testid", "answer");
  try {
    const response = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      reply.textContent = body.detail || ("Error " + response.status);
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const e of events) {
        if (!e.startsWith("data: ")) continue;
        const data = JSON.parse(e.slice(6));
        if (data.type === "token") reply.firstChild ? reply.firstChild.textContent += data.text : reply.append(data.text);
        if (data.type === "done") {
          const meta = document.createElement("div");
          meta.className = "meta";
          if (data.blocked) meta.textContent = "Stopped by a guardrail: " + data.guardrail.join("; ");
          else meta.textContent = data.sources.length ? "Sources: " + data.sources.join("; ") : "No sources: the bot declined.";
          reply.appendChild(meta);
        }
      }
    }
  } catch (err) {
    reply.textContent = "Could not reach the chatbot: " + err;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
